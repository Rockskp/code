[project]
name = "agentkit"
version = "0.1.0"
description = "Shared agent platform kit: guardrails, policy engine, tool gateway, agentic RAG, model routing, evals."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
]

[project.optional-dependencies]
graph = ["langgraph>=1.0"]
api = ["fastapi>=0.115", "httpx>=0.27"]
mcp = ["mcp>=2.0"]
agentcore = ["bedrock-agentcore>=0.1"]
llm = ["anthropic>=1.0", "langchain-core>=1.0"]
observability = ["langfuse>=3.0", "opentelemetry-api>=1.27"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
