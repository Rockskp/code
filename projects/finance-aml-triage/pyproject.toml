[project]
name = "sentinel-aml"
version = "0.1.0"
description = "Sentinel: L1 AML alert triage agent with human-in-the-loop SAR approval (synthetic data)."
requires-python = ">=3.12"
dependencies = [
  "agentkit[graph,api,mcp]",
  "pydantic>=2.8",
]

[project.optional-dependencies]
live = ["agentkit[llm,observability]"]
aws = ["agentkit[agentcore]", "langgraph-checkpoint-postgres>=2.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
agentkit = { path = "../../platform/agentkit", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
